name: CI

on:
  push:
    branches: [main]
    paths:
      - "paperqa/**"
      - "app.py"
      - "data/**"
      - "eval/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "paperqa/**"
      - "app.py"
      - "data/**"
      - "eval/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper-qa-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Install project and optional UI dependencies
        run: python -m pip install -e ".[dev,ui]"
      - name: Run unit tests
        run: python -m pytest -q
      - name: Smoke-test the offline extractive CLI
        run: python -m paperqa eval data/sample_paper.pdf --llm extractive
