[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperqa-agent"
version = "0.1.0"
description = "Ask questions about a research paper; get cited answers or an honest 'not found'."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pypdf>=4.0", "numpy>=1.26", "scikit-learn>=1.3"]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
embeddings = ["sentence-transformers>=3.0"]
ui = ["streamlit>=1.35"]
dev = ["pytest>=8.0", "reportlab>=4.0"]

[tool.setuptools.packages.find]
include = ["paperqa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
