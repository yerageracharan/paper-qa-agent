<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="t d"><title id="t">The agent's honesty checks</title><desc id="d">A diagram of four validation checks: coverage gate, model refusal, citation validation and number checking.</desc>
<rect width="1200" height="380" rx="24" fill="#f7f2fb"/>
<text x="50" y="58" font-family="Arial" font-size="25" font-weight="900" fill="#302144">FOUR GUARDIANS STAND BETWEEN YOU AND A GUESS</text>
<g font-family="Arial">
 <g transform="translate(50 100)"><rect width="255" height="188" rx="18" fill="#fff" stroke="#604080" stroke-width="4"/><circle cx="42" cy="45" r="25" fill="#ffe69a"/><text x="42" y="53" text-anchor="middle" font-size="24" font-weight="900" fill="#302144">1</text><text x="80" y="50" font-size="19" font-weight="900" fill="#302144">Coverage gate</text><text x="24" y="100" font-size="14" fill="#655274">Does the retrieved text</text><text x="24" y="122" font-size="14" fill="#655274">cover the key terms?</text><text x="24" y="160" font-size="12" fill="#9b3b55">Low coverage → refuse</text></g>
 <g transform="translate(345 100)"><rect width="255" height="188" rx="18" fill="#fff" stroke="#604080" stroke-width="4"/><circle cx="42" cy="45" r="25" fill="#ffe69a"/><text x="42" y="53" text-anchor="middle" font-size="24" font-weight="900" fill="#302144">2</text><text x="80" y="50" font-size="19" font-weight="900" fill="#302144">Answerer refusal</text><text x="24" y="100" font-size="14" fill="#655274">Can the answerer find</text><text x="24" y="122" font-size="14" fill="#655274">the fact in the excerpts?</text><text x="24" y="160" font-size="12" fill="#9b3b55">No → NOT_FOUND</text></g>
 <g transform="translate(640 100)"><rect width="255" height="188" rx="18" fill="#fff" stroke="#604080" stroke-width="4"/><circle cx="42" cy="45" r="25" fill="#ffe69a"/><text x="42" y="53" text-anchor="middle" font-size="24" font-weight="900" fill="#302144">3</text><text x="80" y="50" font-size="19" font-weight="900" fill="#302144">Citation check</text><text x="24" y="100" font-size="14" fill="#655274">Is there a valid [S#]</text><text x="24" y="122" font-size="14" fill="#655274">source reference?</text><text x="24" y="160" font-size="12" fill="#9b3b55">Missing → reject</text></g>
 <g transform="translate(935 100)"><rect width="215" height="188" rx="18" fill="#fff" stroke="#604080" stroke-width="4"/><circle cx="42" cy="45" r="25" fill="#ffe69a"/><text x="42" y="53" text-anchor="middle" font-size="24" font-weight="900" fill="#302144">4</text><text x="80" y="50" font-size="19" font-weight="900" fill="#302144">Number guard</text><text x="24" y="100" font-size="14" fill="#655274">Do answer numbers</text><text x="24" y="122" font-size="14" fill="#655274">appear in cited text?</text><text x="24" y="160" font-size="12" fill="#9b3b55">Unsupported → reject</text></g>
</g>
<text x="600" y="340" text-anchor="middle" font-family="Arial" font-size="14" fill="#655274">These checks reduce unsupported answers; they do not guarantee that every answer is correct.</text>
</svg>