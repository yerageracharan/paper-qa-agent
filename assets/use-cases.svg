<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t d"><title id="t">Paper Q and A agent example research tasks</title><desc id="d">Four comic panels showing a student checking a method, hunting for a result, finding a section and asking about a fact absent from the paper.</desc>
<rect width="1200" height="440" rx="24" fill="#211a35"/>
<text x="50" y="58" font-family="Arial" font-size="25" font-weight="900" fill="#ffe69a">FOUR RESEARCH QUESTS — ONE PDF AT A TIME</text>
<g font-family="Arial">
 <g transform="translate(48 94)"><rect width="255" height="290" rx="18" fill="#fff" stroke="#b89add" stroke-width="4"/><rect width="255" height="48" rx="18" fill="#e9ddf8"/><text x="20" y="31" font-size="16" font-weight="900" fill="#302144">01 / METHOD CHECK</text><text x="24" y="100" font-size="28">🧪</text><text x="24" y="146" font-size="16" font-weight="800" fill="#302144">“What method did</text><text x="24" y="170" font-size="16" font-weight="800" fill="#302144">the authors use?”</text><text x="24" y="226" font-size="13" fill="#655274">Look for the method and</text><text x="24" y="247" font-size="13" fill="#655274">its cited section/page.</text></g>
 <g transform="translate(337 94)"><rect width="255" height="290" rx="18" fill="#fff" stroke="#b89add" stroke-width="4"/><rect width="255" height="48" rx="18" fill="#e9ddf8"/><text x="20" y="31" font-size="16" font-weight="900" fill="#302144">02 / RESULT HUNT</text><text x="24" y="100" font-size="28">📊</text><text x="24" y="146" font-size="16" font-weight="800" fill="#302144">“Which layers kept</text><text x="24" y="170" font-size="16" font-weight="800" fill="#302144">their adapters?”</text><text x="24" y="226" font-size="13" fill="#655274">Retrieve the relevant fact</text><text x="24" y="247" font-size="13" fill="#655274">and show its evidence.</text></g>
 <g transform="translate(626 94)"><rect width="255" height="290" rx="18" fill="#fff" stroke="#b89add" stroke-width="4"/><rect width="255" height="48" rx="18" fill="#e9ddf8"/><text x="20" y="31" font-size="16" font-weight="900" fill="#302144">03 / SECTION FINDER</text><text x="24" y="100" font-size="28">🧭</text><text x="24" y="146" font-size="16" font-weight="800" fill="#302144">“Where do they</text><text x="24" y="170" font-size="16" font-weight="800" fill="#302144">discuss limitations?”</text><text x="24" y="226" font-size="13" fill="#655274">Use section-aware chunks</text><text x="24" y="247" font-size="13" fill="#655274">to find the discussion.</text></g>
 <g transform="translate(915 94)"><rect width="237" height="290" rx="18" fill="#fff" stroke="#e19a83" stroke-width="4"/><rect width="237" height="48" rx="18" fill="#fbe3d8"/><text x="20" y="31" font-size="16" font-weight="900" fill="#542f35">04 / ABSENT FACT</text><text x="24" y="100" font-size="28">🚫</text><text x="24" y="146" font-size="16" font-weight="800" fill="#542f35">“What was the</text><text x="24" y="170" font-size="16" font-weight="800" fill="#542f35">carbon footprint?”</text><text x="24" y="226" font-size="13" fill="#76575a">If the paper does not say,</text><text x="24" y="247" font-size="13" fill="#76575a">the agent should abstain.</text></g>
</g>
</svg>